version: '3'

services:
  frontend:
    image: sergiosierraic/resilient-frontend:v0.0.2
    ports:
      - "80:80"
    depends_on:
      - database_backend
  database_backend:
    image: sergiosierraic/resilient-database-backend:v0.0.2
    ports:
      - "8000:8000"
      - "5432:5432"
    env_file:
      - vars.env
